[project]
name = "italki-class-assistant"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "freesimplegui>=5.3.0.post1",
    "googletrans>=4",
    "pyperclip>=1.11.0",
    "python-decouple>=3.8",
    "sqlmodel>=0.0.47",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[tool.ruff]
line-length = 79
